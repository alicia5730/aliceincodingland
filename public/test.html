<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }

    #menuButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    .return-bar {
        width: 100%;
        background: #333;
        color: #fff;
        text-align: center;
        padding: 10px;
        position: absolute;
        top: 0;
    }

    #returnButton {
        background: #fff;
        color: #333;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
    }

    .iframe-container {
        width: 0;
        height: 0;
        overflow: hidden;
        transition: width 1s ease-out, height 1s ease-out;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 20;
    }

    .iframe-background {
        width: 1000px; /* Same as the iframe width */
        height: 600px; /* Same as the iframe height */
        background: #f5f5dc; /* Light beige color to mimic paper */
        border: 1px solid #dcdcdc; /* Light gray border */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1s ease-out;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .iframe-container.open {
        width: 1000px;
        height: 600px;
    }

    .iframe-container.open .iframe-background {
        transform: scaleX(1);
    }

</style>
<body>
<button id="menuButton">Open Map</button>
<div id="overlay">
    <div class="return-bar">
        <button id="returnButton">Return to Home</button>
    </div>
    <div class="iframe-container">
        <div class="iframe-background">
            <iframe src="Skills.html" frameborder="0"></iframe>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menuButton = document.getElementById('menuButton');
        const overlay = document.getElementById('overlay');
        const iframeContainer = document.querySelector('.iframe-container');
        const returnButton = document.getElementById('returnButton');

        menuButton.addEventListener('click', () => {
            overlay.style.display = 'flex';
            setTimeout(() => {
                iframeContainer.classList.add('open');
            }, 100); // Delay to allow overlay display to take effect
        });

        returnButton.addEventListener('click', () => {
            iframeContainer.classList.remove('open');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1000); // Delay to match the iframe closing animation
        });
    });

</script>
</body>
</html>
